<!DOCTYPE html>
<!--[if lt IE 7]>      <html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if IE 7]>         <html class="no-js lt-ie9 lt-ie8"> <![endif]-->
<!--[if IE 8]>         <html class="no-js lt-ie9"> <![endif]-->
<!--[if gt IE 8]>      <html class="no-js"> <!--<![endif]-->
<html>

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>kmake - online JSON lyrics generator</title>
    <meta name="description" content="Introducing a new way to make and preview lyrics, right in your web browser.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="shortcut icon" href="assets/kmake-icon.png" type="image/png">
    <link rel="stylesheet" href="css/normalize.css">
    <link rel="stylesheet" href="https://cdn.plyr.io/3.7.8/plyr.css" />
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/lyrics.css">
    <link rel="manifest" href="manifest.webmanifest">
    <meta property="og:title" content="kmake - online JSON lyrics generator" />
    <meta property="og:description"
        content="Introducing a new way to make and preview lyrics, right in your web browser." />
    <meta property="og:site_name" content="kmake" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kmake.vincelinise.me" />
    <meta property="og:image" content="images/banner.jpg" />
</head>

<body>
    <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->

    <div id="loading">
        <div class="loading-content">
            <svg class="circular" height="50" width="50">
                <circle class="path" cx="25" cy="25" r="20" fill="none" stroke-width="6" stroke-miterlimit="10" />
            </svg>
            <p class="loadingText">Loading Kmake...</p>
        </div>
    </div>

    <div id="header">
        <div class="header-content">
            <img src="assets/kmake-logo.png" class="logo" />
            <span class="header-divider"></span>
            <div class="buttons-actions">
                <button id="btn-nav-home" data-active="true" onclick="toggleHomePage()" title="Projects">Projects</button>
                <button id="menu-file" class="editor-menu-btn" style="display:none">File</button>
                <button id="menu-song" class="editor-menu-btn" style="display:none">Song</button>
                <button id="menu-tools" class="editor-menu-btn" style="display:none">Tools</button>
                <button id="btn-settings-modal" onclick="openSettingsModal()">Settings</button>
                <button id="menu-help">Help</button>
            </div>
        </div>
    </div>

    <div id="home-page" class="home-page-view" style="display:flex">
        <div class="home-page-inner">
            <div class="home-page-header">
                <div class="home-page-title-group">
                    <h1>Projects <span class="version-tag">3.0</span></h1>
                    <p>Continue working on an existing lyrics project or create a new one</p>
                </div>
                <div class="home-page-actions">
                    <button class="btn-secondary" onclick="importProjectFromHome()">
                        <i data-lucide="folder-open"></i> Import File
                    </button>
                    <button class="btn-primary" onclick="createNewProjectFromHome()">
                        <i data-lucide="plus"></i> New Project
                    </button>
                </div>
            </div>
            <div id="home-projects-list" class="home-projects-list"></div>
        </div>
    </div>
    <div id="app" style="display:none">
        <div class="part part-sortable part-left">
            <div class="inner-part">
                <div class="inner-part-title">
                    <p>Lyrics</p>
                </div>
                <div class="inner-part-buttons buttons-top">
                    <button onclick="parseLyrics()" id="btn-parse-lyrics">Parse</button>
                </div>
                <textarea oninput="parseLyrics()" class="inner-part-content" id="lyrics-input"
                    placeholder="Paste your lyrics or paste 2 times your JSON content."></textarea>
            </div>
        </div>
        <div class="part">
            <div class="inner-part ignore-elements" id="center-part">
                <div class="inner-part-title center-title-bar">
                    <div class="mode-steps" id="center-mode-steps">
                        <button class="mode-step-btn active" id="tab-mode-sync" onclick="setCenterMode('sync')">
                            <i data-lucide="mic"></i> Sync
                        </button>
                        <span class="mode-step-arrow"><i data-lucide="chevron-right"></i></span>
                        <button class="mode-step-btn" id="tab-mode-timeline" onclick="setCenterMode('timeline')">
                            <i data-lucide="sliders-horizontal"></i> Timeline
                        </button>
                        <span class="mode-step-arrow"><i data-lucide="chevron-right"></i></span>
                        <button class="mode-step-btn" id="tab-mode-preview" onclick="setCenterMode('preview')">
                            <i data-lucide="play"></i> Preview
                        </button>
                    </div>
                </div>
                <div class="inner-part-buttons buttons-top" id="toolbar-sync">
                    <button onclick="nextWord()" id="nextword-button">Next word <span id="lbl-key-stamp">(Enter)</span></button>
                    <button onclick="stepBackWord()" id="stepback-button">Step back <span id="lbl-key-back">(Backspace)</span></button>
                </div>
                <div class="inner-part-buttons buttons-top" id="toolbar-timeline" style="display:none">
                    <button id="tl-btn-follow" class="enabled" onclick="toggleTimelineFollow()">
                        <i data-lucide="scan"></i> Follow
                    </button>
                    <button id="tl-btn-ripple" onclick="toggleTimelineRipple()">
                        <i data-lucide="move-horizontal"></i> Rolling
                    </button>
                    <button id="tl-btn-snap" class="enabled" onclick="toggleTimelineSnap()">
                        <i data-lucide="magnet"></i> Snap
                    </button>
                    <div class="tl-zoom-controls">
                        <button onclick="timelineZoom(-20)" title="Zoom out"><i data-lucide="minus"></i></button>
                        <span id="tl-zoom-label" class="tl-zoom-label">100%</span>
                        <button onclick="timelineZoom(20)" title="Zoom in"><i data-lucide="plus"></i></button>
                    </div>
                </div>
                <div class="inner-part-buttons buttons-top" id="toolbar-preview" style="display:none">
                    <button id="prev-btn-wbw" class="enabled" onclick="togglePreviewWordByWord()">
                        <i data-lucide="type"></i> Word-by-Word
                    </button>
                    <button id="prev-btn-blur" class="enabled" onclick="togglePreviewBlur()">
                        <i data-lucide="eye"></i> Blur inactive
                    </button>
                    <button id="prev-btn-display" onclick="cyclePreviewDisplayMode()">
                        <i data-lucide="languages"></i> <span id="prev-display-label">Original</span>
                    </button>
                </div>
                <div id="lyrics-content" data-theme="default" class="inner-part-content">

                </div>
                <div id="timeline-view" class="inner-part-content timeline-container" style="display:none" tabindex="0">
                    <div class="tl-scroll-area" id="tl-viewport">
                        <div class="tl-grid-stage" id="tl-stage">
                            <div class="tl-top-sticky" id="tl-top-sticky">
                                <div class="tl-ruler-row">
                                    <div class="tl-gutter-head"></div>
                                    <div class="tl-ruler" id="tl-ruler"></div>
                                </div>
                                <div class="tl-wave-row" id="tl-wave-row">
                                    <div class="tl-gutter-wave"><i data-lucide="music"></i></div>
                                    <div class="tl-wave-track" id="tl-wave-track">
                                        <canvas id="tl-waveform"></canvas>
                                    </div>
                                </div>
                            </div>
                            <div class="tl-rows-body" id="tl-rows-body"></div>
                            <div class="tl-marquee-box" id="tl-marquee-box" style="display:none"></div>
                            <div class="tl-playhead" id="tl-playhead"></div>
                        </div>
                    </div>
                </div>
                <div id="preview-stage" class="inner-part-content preview-stage-wrap" style="display:none">
                    <div class="preview-ambient-bg" id="preview-ambient-bg"></div>
                    <div id="lyrics-plus-container-parent" class="preview-lyrics-scroller"></div>
                </div>
            </div>
        </div>
        <div class="part part-sortable part-right">
            <div class="inner-part">
                <div class="inner-part-title">
                    <p>Properties</p>
                </div>
                <div class="inner-part-buttons buttons-top">
                    <button onclick="unselect()" id="unselect-btn" title="Clear selection">Unselect</button>
                    <button id="properties-preview" class="preview-play-btn" title="Preview this word">Play</button>
                </div>
                <div class="inner-part-content properties" id="properties-panel">

                    <div class="props-empty" id="props-empty">
                        <div class="props-empty-icon"><i data-lucide="mouse-pointer-click"></i></div>
                        <p>Click any word in the Sync panel to select it</p>
                    </div>

                    <div class="props-filled" id="props-filled" style="display:none">

                        <div class="props-word-chip" id="props-word-chip">
                            <span class="props-word-label" id="props-word-label">WORD</span>
                            <span class="props-word-text" id="properties-word"></span>
                        </div>

                        <div class="props-inline-field" id="props-syl-rom-wrap">
                            <span class="props-mini-label">Syllable Romanization</span>
                            <input type="text" id="properties-word-romanized" class="props-mini-input" placeholder="Romanized syllable" oninput="onSelectedSyllableRomanizedInput(this.value)" />
                        </div>

                        <div class="props-word-actions" id="props-word-actions">
                            <button class="btn-word-action" id="btn-split-word" onclick="promptSplitWord()" title="Split word into syllables using ]">Split</button>
                            <button class="btn-word-action" id="btn-merge-word" onclick="mergeSelectedWithNext()" title="Merge selected syllable(s)">Merge</button>
                            <button class="btn-word-action" id="btn-toggle-background" onclick="toggleBackgroundVocal()" title="Toggle background vocal on selection">Background</button>
                        </div>

                        <div class="props-time-block">
                            <div class="props-time-header">
                                <span class="props-time-label">Start</span>
                                <span class="props-time-display" id="props-start-display">0:00.000</span>
                            </div>
                            <div class="props-nudge-row">
                                <button class="nudge-btn" onclick="nudgeProperty('start', event.shiftKey ? -100 : -10)" title="-10ms (Shift: -100ms)">−10</button>
                                <input type="number" id="properties-start" class="props-raw-input" value="0" title="Raw ms value" />
                                <button class="nudge-btn" onclick="nudgeProperty('start', event.shiftKey ? 100 : 10)" title="+10ms (Shift: +100ms)">+10</button>
                            </div>
                            <button class="btn-sync-here" onclick="syncWordToCursor('start')" title="Set to current playback position">Sync to playhead</button>
                        </div>

                        <div class="props-time-block">
                            <div class="props-time-header">
                                <span class="props-time-label">Duration</span>
                                <span class="props-time-display" id="props-length-display">0:00.000</span>
                            </div>
                            <div class="props-nudge-row">
                                <button class="nudge-btn" onclick="nudgeProperty('length', event.shiftKey ? -100 : -10)" title="-10ms (Shift: -100ms)">−10</button>
                                <input type="number" id="properties-length" class="props-raw-input" value="0" title="Raw ms value" />
                                <button class="nudge-btn" onclick="nudgeProperty('length', event.shiftKey ? 100 : 10)" title="+10ms (Shift: +100ms)">+10</button>
                            </div>
                            <button class="btn-sync-here" onclick="syncWordToCursor('end')" title="Set end (or stretch multi-selection end) to current playback position">Sync end to playhead</button>
                            <div class="props-word-actions" id="props-multi-retime" style="display:none;margin-top:4px">
                                <button class="btn-word-action" onclick="scaleSelectedWordsTiming(0.9)" title="Compress selected timing span by 10%">90%</button>
                                <button class="btn-word-action" onclick="scaleSelectedWordsTiming(1.1)" title="Stretch selected timing span by 10%">110%</button>
                                <button class="btn-word-action" onclick="distributeSelectedWordsEvenly()" title="Distribute selected syllables evenly across their time span">Evenly</button>
                            </div>
                        </div>

                        <div class="props-divider"></div>

                        <div class="props-section-label">SELECTED LINE</div>
                        <div class="props-line-chip" id="props-line-chip">
                            <span class="props-line-text" id="properties-line-text">—</span>
                        </div>

                        <div class="props-agent-row">
                            <span class="props-time-label">Singer</span>
                            <select id="properties-line-agent" onchange="changeSelectedLineAgent(this.value)" class="props-agent-select">
                            </select>
                        </div>
                        <div class="props-inline-field">
                            <div class="props-mini-header">
                                <span class="props-mini-label">Line Romanization</span>
                                <button class="btn-mini-link" onclick="distributeLineRomanizationToSyllables()">Apply to syllables</button>
                            </div>
                            <input type="text" id="properties-line-romanized" class="props-mini-input" placeholder="Romanized line (use ] or space)" onchange="onSelectedLineRomanizedChange(this.value)" />
                        </div>
                        <div class="props-inline-field">
                            <span class="props-mini-label">Line Translation</span>
                            <input type="text" id="properties-line-translated" class="props-mini-input" placeholder="Translated line" oninput="onSelectedLineTranslatedInput(this.value)" />
                        </div>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <div id="navbar" class="inner-part inner-music" visible="false" style="display:none">
        <div class="richer-music">
            <div class="inner-part-title">
                <p>Music</p>
            </div>
            <div class="inner-part-buttons buttons-top">
                <button onclick="importSong()" id="btn-load-song">Load From File</button>
                <button onclick="importYoutube()" id="youtube-button">Load From YouTube</button>
                <button onclick="playPause()" id="playpause-button">Play/Pause <span>(Space)</span></button>
                <button onclick="reset()" id="btn-reset-song">Reset</button>
            </div>
            <div class="inner-part-content">
                <div class="music_data">
                    <img id="music-album-art">
                    <div class="music-data-text">
                        <p id="music-title"></p>
                        <p id="music-artist"></p>
                        <p id="music-album"></p>
                    </div>
                </div>
                <input type="file" id="music-input">
            </div>
        </div>
        <div class="music-inner">
            <audio id="music-player"></audio>
            <div class="show-more" onclick="toggleMusicPlayer()"></div>
        </div>
    </div>

    <script src="https://unpkg.com/@popperjs/core@2"></script>
    <script src="https://unpkg.com/tippy.js@6"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://cdn.plyr.io/3.7.8/plyr.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"
        integrity="sha512-Eezs+g9Lq4TCCq0wae01s9PuNWzHYoCMkE97e2qdkYthpI0pzC3UGB03lgEHn2XM85hDOUF6qgqqszs+iXU4UA=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsmediatags/3.9.5/jsmediatags.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>
    <script src="js/parser.js"></script>
    <script src="js/lyricsRenderer.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
